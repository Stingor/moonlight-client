# ─────────────────────────────────────────────────────────────────────────────
#  Les succès que le serveur connaît
#
#  Exporté de l'achievement_db du serveur Moonlight (mode Prerenewal) par
#  scripts/yaml_tables/achievements.py. Ne pas éditer à la main :
#      python scripts/yaml_tables/achievements.py \
#          --serveur <dépôt moonlight> --sortie dist/data/yaml_files/achievements.yml
#
#  achievements : identifiant du succès -> name (son nom), score (les points
#    qu'il rapporte), targets (chaque objectif : [numéro, compte qui
#    l'achève]), reward (item et title : l'item et le titre donnés, 0 si
#    aucun ; script : il exécute un script, l'aide que la fenêtre montre),
#    dependents (les succès à achever d'abord).
#
#  Lu par moonclient (ro/vfs/achievement_catalog.h), qui y joint les textes,
#  les onglets et les icônes de la table du client. Un succès absent d'ici ne
#  s'obtient pas et ne se montre pas. Absente, la fenêtre des succès reste vide.
# ─────────────────────────────────────────────────────────────────────────────
