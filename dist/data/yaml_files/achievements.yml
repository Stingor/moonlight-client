#
# ─────────────────────────────────────────────────────────────────────────────
#  Les succès que le serveur connaît, et ce que la fenêtre en montre
#
#  La liste des succès et tout sauf `window` sont exportés de l'achievement_db
#  du serveur Moonlight (mode Prerenewal). Les champs de `window` sont tirés de
#  SystemEN\achievements.lub de l'installation : les textes de Gravity
#  traduits par ROenglishRE, et ceux des succès que le serveur Moonlight a
#  ajoutés. Ce dépôt ne revendique pas ces textes comme siens.
#
#  Fichier produit par scripts/yaml_tables/achievements.py. Ne pas éditer à la
#  main :
#      python scripts/yaml_tables/achievements.py --serveur <dépôt moonlight> \
#          --client <dossier client> --sortie dist/data/yaml_files/achievements.yml
#
#  achievements : identifiant du succès -> name (son nom), score (les points
#    qu'il rapporte), targets (chaque objectif : [numéro, compte qui
#    l'achève]), reward (item et title : l'item et le titre donnés, 0 si
#    aucun ; script : il exécute un script, l'aide que la fenêtre montre),
#    dependents (les succès à achever d'abord), et window :
#      summary, details : le résumé et le détail ;
#      gauge : bullets (une puce par objectif) ou counts (un compte par
#        objectif, sur le but de `targets` au même rang) ;
#      group : le groupe qui nomme l'icône de la ligne ;
#      major, minor : l'onglet (1 à 6) et le sous-onglet ;
#      objectives : le texte de chaque objectif, et shortcut, le succès que la
#        ligne désigne ;
#      buff : l'état que l'aide donnée en récompense montre, s'il y en a un.
#
#  Lu par moonclient (ro/vfs/achievement_database.h). Un succès absent d'ici ne
#  s'obtient pas et ne se montre pas ; un succès sans `window` ne se montre pas.
#  Absente, la fenêtre des succès reste vide.
# ─────────────────────────────────────────────────────────────────────────────
