# ─────────────────────────────────────────────────────────────────────────────
#  Les effets de chapeau
#
#  Tiré de data\luafiles514\lua files\hateffectinfo\hateffectids.lub et
#  hateffectinfo.lub, tels que les livre moonlight.grf : des tables de Gravity,
#  que ce dépôt ne revendique pas comme siennes.
#
#  Fichier produit par scripts/yaml_tables/hat_effects.py. Ne pas éditer à la
#  main :
#      python scripts/yaml_tables/hat_effects.py --client <dossier client> \
#          --serveur <moonlight> --sortie dist/data/yaml_files/hat_effects.yml
#
#  hat_effects : numéro d'effet de chapeau (celui que le serveur envoie) ->
#    name, la constante HAT_EF_ du client ;
#    file, le .str, relatif au dossier des effets ;
#    effect_id, un identifiant d'effet ordinaire ;
#    offset, ce qui s'ajoute à la hauteur de l'ancre, et offset_x, le décalage
#      vers la droite de l'écran, en unités du monde ;
#    les drapeaux adjust_position_when_shrunk, adjust_size_when_shrunk,
#      render_before_character, ignore_riding, attached_head, effect_pair.
#  Un champ absent vaut vide, zéro ou faux.
#
#  Lu par moonclient (ro/render/hat_effect_table.h). Absent, aucune aura de
#  costume ni de monture ne paraît.
# ─────────────────────────────────────────────────────────────────────────────
