# ─────────────────────────────────────────────────────────────────────────────
#  Le sprite, la famille et le bruit de chaque classe d'arme
#
#  Tirés de data\luafiles514\lua files\datainfo\weapontable.lub que livre
#  moonlight.grf, traduction ROenglishRE : ce dépôt ne le revendique pas comme
#  sien.
#
#  Fichier produit par scripts/yaml_tables/sprite_tables.py. Ne pas éditer à la
#  main :
#      python scripts/yaml_tables/sprite_tables.py --serveur <dépôt moonlight> \
#          --client <installation> --sortie dist/data/yaml_files
#
#  weapons : classe d'arme -> symbol (le premier nom que Weapon_IDs lui donne),
#    sprite (WeaponNameTable), family (la classe dont une classe étendue prend
#    l'animation, le bruit et le sprite de repli : Expansion_Weapon_IDs),
#    hit_sound (le bruit d'un coup de cette classe : WeaponHitWaveNameTable).
#
#  Lu par moonclient (ro/render/sprite_tables.h).
#  Absent, rien ne se tient en main et tout coup est muet.
# ─────────────────────────────────────────────────────────────────────────────
