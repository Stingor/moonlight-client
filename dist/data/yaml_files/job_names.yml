# ─────────────────────────────────────────────────────────────────────────────
#  Le nom affiché de chaque métier
#
#  Les noms sont ceux de lua files\datainfo\pcjobname.lub, lus par
#  jobidentity.lub, tels que les livre moonlight.grf : la traduction de
#  ROenglishRE, sous la mention ci-dessus. Les identifiants sont ceux de la
#  job_db du serveur Moonlight (mode Prerenewal) ; le commentaire de chaque ligne
#  y nomme le métier.
#
#  Fichier produit par scripts/yaml_tables/job_names.py. Ne pas éditer à la main :
#      python scripts/yaml_tables/job_names.py --serveur <dépôt moonlight> \
#          --client <dossier client> --sortie dist/data/yaml_files/job_names.yml
#
#  jobs : identifiant du métier -> son nom affiché.
#
#  Lu par moonclient (ro/vfs/job_names.h). Absent, la fiche d'un personnage
#  n'écrit que ses niveaux.
# ─────────────────────────────────────────────────────────────────────────────
