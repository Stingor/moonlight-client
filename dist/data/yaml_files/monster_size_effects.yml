# ─────────────────────────────────────────────────────────────────────────────
#  L'échelle et les effets d'office de certains monstres
#
#  Tiré de SystemEN\monster_size_effect.lub, tel que le client d'origine le
#  trouve sur le disque de son installation : la traduction ROenglishRE
#  (https://github.com/llchrisll/ROenglishRE, travaux de zackdreaver poursuivis
#  par llchrisll) de la table de Gravity. Sa licence en permet la distribution
#  et la modification ; ce dépôt ne la revendique pas comme sienne.
#
#  Fichier produit par scripts/yaml_tables/monster_size_effects.py. Ne pas
#  éditer à la main :
#      python scripts/yaml_tables/monster_size_effects.py --client <dossier client> \
#          --serveur <moonlight> --sortie dist/data/yaml_files/monster_size_effects.yml
#
#  monsters : classe du monstre -> size, le facteur du sprite (ombre comprise ;
#    zéro ou moins ne change rien), et effects, les identifiants d'effet qui
#    s'attachent au monstre à son apparition, dans l'ordre de la table. Le
#    commentaire nomme chaque effet par sa constante EF_.
#
#  Lu par moonclient (ro/vfs/monster_size_effects.h). Absent, aucun monstre
#  n'est grandi ni paré.
# ─────────────────────────────────────────────────────────────────────────────
