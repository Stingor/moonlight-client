# ─────────────────────────────────────────────────────────────────────────────
#  Le Laphine : ce que chaque objet déclencheur accepte
#
#  Exporté des tables laphine_* du serveur Moonlight et résolu sur son item_db
#  (mode Prerenewal) par scripts/yaml_tables/laphine.py. Ne pas éditer à la main :
#      python scripts/yaml_tables/laphine.py --serveur <dépôt moonlight>
#
#  Le serveur ne charge pas toutes ces recettes : il n'ouvre que celles de son
#  mode et de ses imports. Une recette de trop ne se voit jamais.
#
#  synthesis : item, piles à déposer, raffinement admis, [objet, quantité]...
#  upgrade   : item, raffinement admis, options exigées, cartes admises, cibles.
#
#  Lu par moonclient (app/items/laphine_book.h). Absent, une fenêtre du Laphine se
#  referme en le disant.
# ─────────────────────────────────────────────────────────────────────────────
