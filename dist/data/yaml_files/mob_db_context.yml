# ─────────────────────────────────────────────────────────────────────────────
#  Le contexte de la base de données du client
#
#  Tiré de la base du serveur Moonlight (rAthena, mode Prerenewal) par
#  scripts/yaml_tables/server_db.py, fusionnée comme le serveur la charge :
#  db/mob_db.yml et chaque import en pied de fichier, dans l'ordre. Ne pas éditer à la
#  main :
#      python scripts/yaml_tables/server_db.py --serveur <dépôt moonlight>
#
#  battle       : les réglages effectifs de conf/battle_athena.conf et de ses
#                 imports — taux de butin et leurs bornes, EXP, apparitions.
#  item_ratios  : objet -> [ratio, [monstres visés]] (mob_item_ratio.yml) ;
#                 une liste vide vise tous les monstres.
#  spawns       : monstre -> {carte: nombre}, les apparitions permanentes des
#                 scripts que moon/scripts_moon.conf charge, cartes de GM
#                 exclues.
#  monsters     : monstre -> [race, élément, niveau d'élément, taille, rang,
#                 bits de comportement], les NOMBRES que le serveur déduit au
#                 chargement — ceux de la fiche qu'il envoie. Rang : 0
#                 ordinaire, 1 mini-boss, 2 MVP.
#
#  Lu par moonclient (ro/vfs/server_db.h), à la première ouverture de la
#  fenêtre « Base de données » seulement.
# ─────────────────────────────────────────────────────────────────────────────

