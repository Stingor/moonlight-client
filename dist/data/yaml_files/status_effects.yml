# ─────────────────────────────────────────────────────────────────────────────
#  Les états (EFST) : nom, description, icône
#
#  Les identifiants viennent du serveur Moonlight (src/map/status.hpp, enum
#  efst_type). Les textes, leurs couleurs et les icônes viennent de
#  lua files\stateicon\efstids.lub, stateiconinfo.lub et stateiconimginfo.lub,
#  tels que les livre moonlight.grf : traduction de zackdreaver
#  (https://github.com/zackdreaver/ROenglishRE), poursuivie par llchrisll
#  (https://github.com/llchrisll/ROenglishRE), que sa licence permet de
#  distribuer, d'utiliser et de modifier. Ce dépôt ne la revendique pas comme
#  sienne.
#
#  Fichier produit par scripts/yaml_tables/status_effects.py. Ne pas éditer à
#  la main :
#      python scripts/yaml_tables/status_effects.py --client <dossier client> \
#          --serveur <dépôt moonlight> --sortie dist/data/yaml_files/status_effects.yml
#
#  statuses : identifiant de l'état (valeur du serveur) ->
#    constant : sa constante EFST_ ;
#    icon     : le fichier de son icône, nu (sous data\texture\effect\) ;
#    priority : le seau de l'icône (gold, red, blue, green, white), l'ordre
#               dans lequel le client montre ce qui ne tient pas ;
#    lines    : les lignes de sa description, dans l'ordre. La première est le
#               nom ; une ligne « %s » est la place de la durée restante ;
#               color, s'il est là, est [rouge, vert, bleu].
#
#  Lu par moonclient (ro/vfs/status_table.h). Absent, les états se montrent
#  par leur numéro et l'icône que le client tient en dur.
# ─────────────────────────────────────────────────────────────────────────────
