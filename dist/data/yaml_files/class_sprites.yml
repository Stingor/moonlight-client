# ─────────────────────────────────────────────────────────────────────────────
#  Le sprite, le rayon au sol et l'ombre de chaque classe de PNJ et de monstre
#
#  Tirés de data\luafiles514\lua files\datainfo\ (npcidentity, jobidentity,
#  jobname, npclocationradius, shadowtable) que livre moonlight.grf, traduction
#  ROenglishRE : ce dépôt ne les revendique pas comme siens. Les identifiants
#  que tient le serveur Moonlight (mode Prerenewal) — classes de PNJ de
#  e_job_types, métiers, monstres de sa mob_db — prennent sa valeur.
#
#  Fichier produit par scripts/yaml_tables/sprite_tables.py. Ne pas éditer à la
#  main :
#      python scripts/yaml_tables/sprite_tables.py --serveur <dépôt moonlight> \
#          --client <installation> --sortie dist/data/yaml_files
#
#  classes : classe -> sprite (le nom du fichier, sans dossier ; « .gr2 » y
#    désigne un modèle 3D), radius (le rayon au sol en cellules, qui fait
#    l'ombre des plus grandes créatures), shadow (le facteur d'ombre, zéro
#    pour aucune). Un champ absent : la table du client ne le donnait pas.
#
#  Lu par moonclient (ro/render/sprite_tables.h).
#  Absent, toute créature est un Poring, et toutes les ombres se valent.
# ─────────────────────────────────────────────────────────────────────────────
