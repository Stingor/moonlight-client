# ─────────────────────────────────────────────────────────────────────────────
#  Les options aléatoires d'équipement, et leur nom affiché
#
#  Les identifiants et les constantes (`option`) sont exportés de
#  l'item_randomopt_db du serveur Moonlight (mode Prerenewal). Les noms (`name`)
#  sont les traductions ROenglishRE que livre moonlight.grf, dans
#  data\luafiles514\lua files\datainfo\enumvar.lub et
#  addrandomoptionnametable.lub : ce dépôt ne les revendique pas comme siennes.
#
#  Fichier produit par scripts/yaml_tables/random_options.py. Ne pas éditer à
#  la main :
#      python scripts/yaml_tables/random_options.py --serveur <dépôt moonlight> \
#          --client <dossier client> --sortie dist/data/yaml_files/random_options.yml
#
#  options : identifiant de l'option, tel que le paquet de l'item le porte ->
#    option (sa constante au serveur) et name (son gabarit : `%d` reçoit la
#    valeur, `%%` s'écrit %). Une option sans `name` s'écrit par son numéro.
#
#  Lu par moonclient (ro/vfs/random_option_names.h). Absent, toutes les options
#  s'écrivent par leur numéro.
# ─────────────────────────────────────────────────────────────────────────────
