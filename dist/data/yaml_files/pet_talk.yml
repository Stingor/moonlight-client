# ─────────────────────────────────────────────────────────────────────────────
#  Ce que disent les familiers
#
#  Tiré de data\pettalktable.xml, tel que le livre moonlight.grf. Les répliques
#  sont celles du jeu, en anglais pour la plupart ; quelques espèces parlent
#  encore coréen, ou un charabia que le fichier porte tel quel. Ce dépôt ne les
#  revendique pas comme siennes. La correspondance classe -> espèce (`classes`,
#  `default_species`) est celle que le client d'origine tient dans son
#  exécutable, recopiée dans le script.
#
#  Fichier produit par scripts/yaml_tables/pet_talk.py. Ne pas éditer à la main :
#      python scripts/yaml_tables/pet_talk.py --client <dossier client> \
#          --sortie dist/data/yaml_files/pet_talk.yml
#
#  classes : classe du familier (identifiant de son monstre) -> son espèce ;
#    une classe absente parle comme `default_species`, et une espèce absente
#    de `species` ne dit rien.
#  species : espèce -> rang de faim (hungry, bit_hungry, noting, full,
#    so_full) -> occasion (feeding, hunting, danger, dead, stand, perfor_s,
#    levelup, perfor_1, perfor_2, perfor_3, connect) -> les répliques, dont le
#    client tire une au sort. Chacune a perdu la tabulation qui l'ouvrait et
#    celle qui la fermait.
#
#  Lu par moonclient (ro/vfs/pet_talk_table.h). Absent, les familiers se taisent ;
#  leurs émoticônes se montrent encore.
# ─────────────────────────────────────────────────────────────────────────────
