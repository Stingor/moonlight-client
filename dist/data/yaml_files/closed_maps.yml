# ─────────────────────────────────────────────────────────────────────────────
#  Les cartes fermées au cycle jour/nuit
#
#  Cavernes, donjons, souterrains : le ciel ne s'y voit pas. Le cycle jour/nuit
#  que le joueur active ne s'y applique pas, et la lumière de la carte reste
#  celle que son RSW déclare. Les intérieurs de indoor_maps.yml — ceux que
#  l'installation nomme dans data\indoorrswtable.txt — en sont déjà retirés :
#  inutile de les répéter ici.
#
#  TENU À LA MAIN. La liste de départ a retenu, dans map_names.yml, les cartes
#  dont le nom dit une caverne, un donjon ou un souterrain, moins celles qu'on
#  sait en plein air. Une carte s'ajoute ou se retire par une ligne ; le
#  commentaire qui suit son nom n'est là que pour la relire.
#
#  maps : les noms de carte, sans extension.
#
#  Lu par moonclient (app/world/closed_maps.h). Absent, le cycle s'applique à
#  toute carte en plein air.
# ─────────────────────────────────────────────────────────────────────────────
