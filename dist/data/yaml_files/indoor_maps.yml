# ─────────────────────────────────────────────────────────────────────────────
#  Les cartes intérieures
#
#  Tiré de data\indoorrswtable.txt de l'installation (lu dans moonlight.grf) : une
#  table de Gravity, que ce dépôt ne revendique pas comme sienne.
#
#  Fichier produit par scripts/yaml_tables/install_text_tables.py.
#  Ne pas éditer à la main :
#      python scripts/yaml_tables/install_text_tables.py --client <dossier client> \
#          --table indoor_maps
#
#  maps : les cartes que la caméra traite en intérieur — recul et altitude
#         resserrés, lacet tenu près de 45° —, par leur clé de table : en
#         minuscules, sans extension, le numéro d'une carte d'instance déjà
#         retiré (« 0011@infi » se cherche comme « 1@infi »).
#
#  Lu par moonclient (ro/vfs/indoor_maps.h).
#  Absent, toute carte garde les bornes du plein air.
# ─────────────────────────────────────────────────────────────────────────────
