#
# ─────────────────────────────────────────────────────────────────────────────
#  Le nom lisible des cartes, et leur bandeau d'arrivée
#
#  La liste des cartes est celle de db/map_index.yml du serveur Moonlight et
#  de ses imports. Les noms et les bandeaux viennent de SystemEN\mapInfo.lub
#  de l'installation, traduction ROenglishRE (mention ci-dessus) ; une carte
#  que cette table ne nomme pas prend le `Name` du serveur.
#
#  Fichier produit par scripts/yaml_tables/map_names.py. Ne pas éditer à la main :
#      python scripts/yaml_tables/map_names.py --serveur <dépôt moonlight> \
#          --client <dossier client> --sortie dist/data/yaml_files/map_names.yml
#
#  maps : carte (son nom au serveur, sans extension) ->
#    name       : le nom montré au joueur ;
#    announced  : vrai quand le jeu montre le bandeau à l'arrivée ;
#    subtitle, title : les deux lignes du bandeau ;
#    background : son image de fond, sans dossier ni extension.
#  Un champ absent est vide (announced : faux). Une carte absente n'a pas de nom.
#
#  Lu par moonclient (ro/vfs/map_display_names.h). Absent, les cartes se
#  montrent par leur nom de fichier.
# ─────────────────────────────────────────────────────────────────────────────
