#  Le libellé des titres
#
#  Les libellés viennent de data\luafiles514\lua files\datainfo\titletable.lub
#  de l'installation : traduction ROenglishRE des titres de Gravity (mention
#  ci-dessus), complétée des titres propres au serveur Moonlight. Les numéros
#  retenus sont ceux que le serveur Moonlight peut envoyer, entre TITLE_BASE et
#  TITLE_MAX.
#
#  Fichier produit par scripts/yaml_tables/titles.py. Ne pas éditer à la main :
#      python scripts/yaml_tables/titles.py --serveur <dépôt moonlight> \
#          --client <dossier client> --sortie dist/data/yaml_files/titles.yml
#
#  titles : numéro du titre -> son libellé. Un numéro absent n'a pas de
#    libellé, et rien ne s'écrit à sa place ; zéro veut dire « aucun titre ».
#
#  Lu par moonclient (ro/render/title_table.h). Absent, aucun titre ne se montre.
# ─────────────────────────────────────────────────────────────────────────────
