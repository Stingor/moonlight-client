# ─────────────────────────────────────────────────────────────────────────────
#  Les commodités des villes, montrées sur la mini-carte
#
#  Tiré des PNJ que le serveur Moonlight charge (moon/scripts_moon.conf et ses
#  scripts) : chaque PNJ placé sur une ville est classé par des règles
#  explicites (scripts/yaml_tables/town_npcs.py), et la liste éditée à la main
#  scripts/yaml_tables/town_info_overrides.yml impose, exclut ou renomme.
#
#  Fichier produit par scripts/yaml_tables/town_info.py. Ne pas éditer à la main :
#      python scripts/yaml_tables/town_info.py --serveur <dépôt moonlight> \
#          --client <dossier client> --sortie dist/data/yaml_files/town_info.yml
#
#  towns : carte (son nom, en minuscules) -> ses commodités :
#    name     : le nom du PNJ, facultatif ;
#    x, y     : sa case ;
#    facility : tool_dealer, weapon_dealer, armor_dealer, smith, guide, inn,
#               kafra ou stylist.
#
#  Lu par moonclient (ro/vfs/town_info.h). Absent, la mini-carte n'a pas
#  d'icônes de commodités.
# ─────────────────────────────────────────────────────────────────────────────
