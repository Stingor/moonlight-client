# ─────────────────────────────────────────────────────────────────────────────
#  Le nom d'espèce des familiers, et le .act de leurs accessoires
#
#  La liste des familiers est la pet_db du serveur Moonlight (mode Prerenewal). Les
#  noms et les .act sont tirés de data\luafiles514\lua files\datainfo\petinfo.lub
#  que livre moonlight.grf, traduction ROenglishRE : ce dépôt ne les revendique
#  pas comme siens. Un familier que cette table ne nomme pas prend le nom de
#  son monstre dans la mob_db du serveur.
#
#  Fichier produit par scripts/yaml_tables/pet_info.py. Ne pas éditer à la
#  main :
#      python scripts/yaml_tables/pet_info.py --serveur <dépôt moonlight> \
#          --client <dossier client> --sortie dist/data/yaml_files/pet_info.yml
#
#  species : classe du familier (identifiant de son monstre) -> nom de l'espèce.
#  accessories : item de l'accessoire -> le .act qui remplace celui du corps
#    quand le familier le porte. Le client ne propose d'équiper que ceux-là.
#
#  Lu par moonclient (ro/vfs/pet_tables.h). Absent, la fiche du familier se
#  montre sans nom d'espèce, et tout accessoire se propose.
# ─────────────────────────────────────────────────────────────────────────────
