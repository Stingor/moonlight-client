# ─────────────────────────────────────────────────────────────────────────────
#  Les états du serveur
#
#  Tiré de la base du serveur Moonlight (rAthena, mode Prerenewal) par
#  scripts/yaml_tables/server_db.py, fusionnée comme le serveur la charge :
#  db/status.yml et chaque import en pied de fichier, dans l'ordre. Ne pas éditer à la
#  main :
#      python scripts/yaml_tables/server_db.py --serveur <dépôt moonlight>
#
#  Seuls les états qui portent un script sont écrits. Bonuses, quand il est
#  là, est ce script lu entier, une commande `bonus` par ligne : Type est le
#  numéro du bonus (enum _sp), Val le rang de la valeur de l'état qu'il prend
#  (1 à 4 : val1 à val4), Negated son signe opposé, Value une valeur fixe.
#  Sans Bonuses, l'effet ne se déduit pas du seul script.
#
#  Lu par moonclient (ro/vfs/server_db.h), à la première ouverture de la
#  fenêtre « Base de données » seulement.
# ─────────────────────────────────────────────────────────────────────────────

