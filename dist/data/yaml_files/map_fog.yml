# ─────────────────────────────────────────────────────────────────────────────
#  Le brouillard des cartes
#
#  Tiré de data\fogparametertable.txt de l'installation (lu dans moonlight.grf) : une
#  table de Gravity, que ce dépôt ne revendique pas comme sienne.
#
#  Fichier produit par scripts/yaml_tables/install_text_tables.py.
#  Ne pas éditer à la main :
#      python scripts/yaml_tables/install_text_tables.py --client <dossier client> \
#          --table map_fog
#
#  maps : carte (son nom, sans extension, casse comprise) ->
#    near    : où le brouillard commence, en fraction de la profondeur de vue ;
#    far     : où il couvre tout, même unité ;
#    color   : [alpha, rouge, vert, bleu] de 0 à 255. L'alpha ne teint rien : il
#              dose le mélange du fond sur les cartes dont le ciel le demande ;
#    density : lue, et sans effet sur un brouillard linéaire.
#  Une carte d'instance se cherche sans son numéro (« 0011@exds » comme
#  « 1@exds »). Une carte absente n'a pas de brouillard.
#
#  Lu par moonclient (ro/render/map_fog.h).
#  Absent, aucune carte n'a de brouillard.
# ─────────────────────────────────────────────────────────────────────────────
