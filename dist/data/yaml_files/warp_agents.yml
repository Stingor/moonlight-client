# ─────────────────────────────────────────────────────────────────────────────
#  Les Warp Agent du serveur
#
#  Tiré des scripts de PNJ du serveur Moonlight, ceux que
#  moon/scripts_moon.conf fait charger : le PNJ « Warp Agent » et chacune de
#  ses copies (`duplicate`). La classe de chaque figure vient de l'énumération
#  e_job_types de src/map/npc.hpp. Le commentaire en bout de ligne nomme le
#  fichier du PNJ.
#
#  Fichier produit par scripts/yaml_tables/warp_agents.py. Ne pas éditer à la
#  main :
#      python scripts/yaml_tables/warp_agents.py --serveur <dépôt moonlight> \
#          --sortie dist/data/yaml_files/warp_agents.yml
#
#  agents : carte où se tient un Warp Agent -> sa figure, par le nom que le
#    script écrit (sprite) et par la classe que le serveur annonce (class).
#
#  Lu par moonclient (ro/vfs/warp_agents.h) : la carte du monde montre la
#  figure du Warp Agent au survol d'une ville qui en a un.
# ─────────────────────────────────────────────────────────────────────────────
version: 1
