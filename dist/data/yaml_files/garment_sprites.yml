# ─────────────────────────────────────────────────────────────────────────────
#  Le sprite de chaque robe (cape, ailes, sac)
#
#  Tiré de data\luafiles514\lua files\datainfo\spriterobeid.lub (traduction
#  ROenglishRE) et spriterobename.lub, et de LayerSizeTypeList de
#  spreditinfo\2dlayerdir_f.lub, que livre moonlight.grf : ce dépôt ne les
#  revendique pas comme siens.
#
#  Fichier produit par scripts/yaml_tables/sprite_tables.py. Ne pas éditer à la
#  main :
#      python scripts/yaml_tables/sprite_tables.py --serveur <dépôt moonlight> \
#          --client <installation> --sortie dist/data/yaml_files
#
#  garments : robe -> symbol (le premier nom que SPRITE_ROBE_IDs lui donne),
#    sprite (le nom de son dossier), small_layer (vrai quand elle prend les
#    PETITES tables de calques de garment_layers.yml ; les grandes sinon).
#
#  Lu par moonclient (ro/render/sprite_tables.h).
#  Absent, aucune cape ne se dessine.
# ─────────────────────────────────────────────────────────────────────────────
