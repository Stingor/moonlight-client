# ─────────────────────────────────────────────────────────────────────────────
#  La musique des cartes
#
#  Tiré de data\mp3nametable.txt de l'installation (lu dans moonlight.grf) : une
#  table de Gravity, que ce dépôt ne revendique pas comme sienne.
#
#  Fichier produit par scripts/yaml_tables/install_text_tables.py.
#  Ne pas éditer à la main :
#      python scripts/yaml_tables/install_text_tables.py --client <dossier client> \
#          --table map_music
#
#  maps : carte (son nom en minuscules, sans extension) -> le fichier de musique,
#         relatif à la RACINE du dossier client et non à une archive : les
#         musiques ne sont pas dans les GRF. Les antislashs, doublés dans le
#         fichier d'origine, sont ici simples.
#
#  Lu par moonclient (ro/vfs/map_music_table.h).
#  Absent, toute carte se joue en silence.
# ─────────────────────────────────────────────────────────────────────────────
