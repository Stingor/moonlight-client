# ─────────────────────────────────────────────────────────────────────────────
#  Le ciel des cartes
#
#  Tiré de MapSkyData, dans data\luafiles514\lua files\mapskydata\mapskydata.lub
#  de l'installation : une table compilée de Gravity, que ce dépôt ne revendique
#  pas comme sienne.
#
#  Fichier produit par scripts/yaml_tables/map_sky.py. Ne pas éditer à la main :
#      python scripts/yaml_tables/map_sky.py --serveur <dépôt moonlight> \
#          --client <dossier client> --sortie dist/data/yaml_files/map_sky.yml
#
#  maps : carte (son nom, sans extension) ->
#    background     : la couleur peinte au-delà des bords, [rouge, vert, bleu]
#                     de 0 à 255 ;
#    background_fog : vrai quand ce fond se mêle au brouillard de la carte ;
#    star           : vrai quand un champ d'étoiles s'y joue ;
#    styles         : les numéros des ciels animés tout faits, dans l'ordre ;
#    clouds         : les nuages paramétrés — count, cull_distance, color,
#                     size, size_extra, expand_rate, alpha_in_time,
#                     alpha_in_time_extra, alpha_in_speed, alpha_out_time,
#                     alpha_out_time_extra, alpha_out_speed, height,
#                     height_extra.
#  Un champ absent est vide (les booléens : faux). Une carte absente s'ouvre sur
#  du noir, sans ciel animé.
#
#  Lu par moonclient (ro/render/map_sky.h). Absent, aucune carte n'a de ciel.
# ─────────────────────────────────────────────────────────────────────────────
