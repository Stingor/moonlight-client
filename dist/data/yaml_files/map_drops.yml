# ─────────────────────────────────────────────────────────────────────────────
#  Les map drops du serveur
#
#  Tiré de la base du serveur Moonlight (rAthena, mode Prerenewal) par
#  scripts/yaml_tables/server_db.py, fusionnée comme le serveur la charge :
#  db/map_drops.yml et chaque import en pied de fichier, dans l'ordre. Ne pas éditer à la
#  main :
#      python scripts/yaml_tables/server_db.py --serveur <dépôt moonlight>
#
#  Une entrée par carte et par monstre ; sans Monster, la ligne vaut pour tous
#  les monstres de la carte. Rate est en n/100000. Le serveur tire ces lignes
#  EN PLUS du butin du monstre, et ses taux de butin ne les touchent pas.
#  RandomOptionGroup : l'objet tombe avec des options aléatoires de ce groupe.
#
#  Lu par moonclient (ro/vfs/server_db.h), à la première ouverture de la
#  fenêtre « Base de données » seulement.
# ─────────────────────────────────────────────────────────────────────────────

