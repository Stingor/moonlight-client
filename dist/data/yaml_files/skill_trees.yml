# ─────────────────────────────────────────────────────────────────────────────
#  Les arbres de compétences que le serveur connaît
#
#  Exporté de la skill_db, de la job_db, du skill_tree et du guild_skill_tree
#  du serveur Moonlight (mode Prerenewal) par scripts/yaml_tables/skill_trees.py.
#  Ne pas éditer à la main :
#      python scripts/yaml_tables/skill_trees.py \
#          --serveur <dépôt moonlight> --sortie dist/data/yaml_files/skill_trees.yml
#
#  skill_free : le serveur ne vérifie ni prérequis ni niveau requis.
#  jobs : métier -> ce qu'il peut apprendre, héritage compris. guild : l'arbre
#    de la guilde. Chaque compétence : id, name (son nom au serveur), max (rang
#    maximal), needs ([compétence, rang] requis), base_level et job_level
#    (niveaux requis), by_points (faux : ne s'apprend pas par points).
#
#  Lu par moonclient (ro/vfs/skill_tree_rules.h). La disposition de la fenêtre
#  — cases, onglets — vient de skill_layout.yml (skill_info.py).
# ─────────────────────────────────────────────────────────────────────────────
