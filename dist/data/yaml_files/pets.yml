#    seul), evolutions (chacune : l'œuf du familier cible, et les matériaux
#    [item, quantité] qu'elle coûte).
#
#  Lu par moonclient (ro/vfs/pet_tables.h). Absent, la fiche du familier se
#  montre sans nourriture ni évolution.
# ─────────────────────────────────────────────────────────────────────────────
