#      python scripts/yaml_tables/pets.py \
#          --serveur <dépôt moonlight> --sortie dist/data/yaml_files/pets.yml
#
#  pets : classe du familier (identifiant de son monstre) -> egg (l'œuf d'où
#    il sort), food (l'item qui le nourrit, 0 s'il ne mange rien), tame
